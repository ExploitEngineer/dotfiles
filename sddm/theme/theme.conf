[General]

Background="backgrounds/default.png"
## Baked-in fallback only. The live value comes from /etc/sddm-wallbash/current.conf,
## written by wallbash on every theme/wallpaper switch (see ../wallbash/). This path is
## relative to this theme directory (same convention SDDM's own Candy theme uses) and
## ships a real copy of this machine's active wallpaper at build time - deliberately NOT
## a path into the user's home directory, because $HOME is mode 700 here (and commonly
## is, by default, everywhere), so the sddm user could never read it from there.

ColorPry1="1D1D1D"
## Primary background color - wallbash dcol_pry1, hex, no leading '#' (QML adds it).
## Default = this machine's actual active HyDE theme (1-Bit) at build time, so a fresh
## install never shows a made-up color before the first wallpaper switch.

ColorTxt1="FFFFFF"
## Primary text/foreground color - wallbash dcol_txt1.

ColorPry2="3A3A3A"
## First accent step - wallbash dcol_pry2. Borders and muted chrome in every layout.

ColorPry3="7F7F7F"
## Second accent step - wallbash dcol_pry3. Secondary text, mid-tone accents.

ColorPry4="B3B3B3"
## Third accent step - wallbash dcol_pry4. Brightest accent, focus/hover states.

Template="1"
## Which of the 5 QML compositions to render:
## 1=1-Bit  2=Bad Blood  3=Rose Pine  4=Synth Wave  5=Catppuccin Mocha
## Picked by wallbash/scripts/pick_layout.py from a hash of the active HyDE theme name,
## so it is stable per theme and spread evenly across all 5 - not a visual match to the
## theme's own name, by design.

ReducedMotion="false"
## QML has no prefers-reduced-motion media query, so this is its replacement: every
## NumberAnimation/SequentialAnimation in every layout checks this before running.
## wallbash sets it from `gsettings get org.gnome.desktop.interaction-accessibility
## reduce-motion` when that schema is available, defaulting to false otherwise.
