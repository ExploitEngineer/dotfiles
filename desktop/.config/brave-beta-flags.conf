# Wayland + NVIDIA hardware video decode.
# Filename must be brave-beta-flags.conf: /usr/bin/brave-beta reads
# $XDG_CONFIG_HOME/brave-beta-flags.conf, not brave-flags.conf.
--ozone-platform-hint=auto
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncodeLinuxGL,AcceleratedVideoDecodeLinuxGL
--disable-features=UseChromeOSDirectVideoDecoder

# Workaround for an NVIDIA 580.178.04 regression, not a Chromium setting.
# nvidia_drm fails in __nv_drm_gem_nvkms_map ("Failed to map NvKmsKapiMemory")
# and the renderer aborts 20-30ms later on the unusable buffer. Zero occurrences
# across eight boots on 580.173.02; every occurrence since the Aug 27 upgrade.
# This stops Chromium allocating video frames through the GPU memory buffer
# path that the driver is failing on, while keeping native Wayland.
# Remove this line once the driver is fixed or downgraded.
--disable-gpu-memory-buffer-video-frames
