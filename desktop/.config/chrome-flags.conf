# Quadro P1000 (Pascal GP107) has BAR1 = 256 MiB and no resizable BAR, so only
# 256 MiB of the 4 GB VRAM is CPU-mappable. Under Chromium GPU workload that
# address space exhausts, __nv_drm_gem_nvkms_map then requests past the BAR
# boundary, the kernel rejects it, and the failure cascades into Xid 32 across
# every GPU client and a dead compositor.
# See NVIDIA/open-gpu-kernel-modules#1134.
#
# These flags keep GPU rendering and rasterization on, which is what makes 3D
# and animated pages fast, while removing the per-frame buffer mappings that
# exhaust BAR1.

# Native Wayland. Unrelated to the fault and stable for months.
--ozone-platform-hint=auto

# Zero-copy video maps a GPU buffer per frame straight into BAR1. This is the
# single largest source of BAR1 pressure on a 256 MiB window.
--disable-features=AcceleratedVideoDecodeLinuxZeroCopyGL

# Stops video frames being allocated as GPU memory buffers, which are mapped.
--disable-gpu-memory-buffer-video-frames

# VA-API is deliberately absent. nvidia-vaapi-driver's own README calls Chromium
# support experimental with "not much success", and every decoded frame costs
# another BAR1 mapping. Enabling it on 2026-08-29 turned frozen tabs into a
# full GPU fault. Do not re-add it on this card.
