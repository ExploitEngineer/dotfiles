# Hardware video acceleration and Wayland hints for the NVIDIA Quadro P1000.
#
# HyDE sets these through hl.env() in ~/.local/share/hypr/lua/env.lua, but that
# mechanism emits nothing: the compiled config at
# ~/.local/state/hyde/hyprland.conf contains zero `env =` lines, and no process
# on the system had these variables set. They are declared here instead.
#
# This file covers systemd user units (waybar and anything dbus-activated).
# /etc/environment covers the session itself via pam_env, which is what reaches
# Hyprland and everything it launches.

LIBVA_DRIVER_NAME=nvidia
NVD_BACKEND=direct
__GLX_VENDOR_LIBRARY_NAME=nvidia
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=auto
